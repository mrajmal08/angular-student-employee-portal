<div class="card">
    <form [formGroup]="studentForm">
        <div class="card-header">
            <span>Add Student</span>
            <span class="position-absolute" style="right: 10px; cursor: pointer; color: white">

                <i class="fa fa-times" (click)="closeForm()" style="cursor: pointer; font-size: 24px; right: 10px"></i>

            </span>
        </div>

        <div class="card-body">
            <div>


                <!-- Personal Details -->
                <div class="row mt-3">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Given Name:<sup *ngIf="displayValidation">*</sup></label>
                            <input type="text" class="form-control" formControlName="name" />
                            <small class="text-danger" *ngIf="studentForm.get('name')?.errors?.['required']">Please
                                enter
                                your
                                given name!</small>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Surname:<sup *ngIf="displayValidation">*</sup></label>
                            <input type="text" class="form-control" formControlName="surname" />
                            <small class="text-danger" *ngIf="studentForm.get('surname')?.errors?.['required']">Please
                                enter
                                your
                                surname!</small>
                        </div>
                    </div>


                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Date of Birth:<sup *ngIf="displayValidation">*</sup></label>
                            <input type="date" class="form-control" formControlName="date_of_birth" />
                            <small class="text-danger"
                                *ngIf="studentForm.get('date_of_birth')?.errors?.['required']">Please
                                enter
                                your date
                                of
                                birth!</small>
                        </div>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="row mt-3">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Gender:<sup *ngIf="displayValidation">*</sup></label>
                            <select class="form-control" formControlName="gender">
                                <option value="" disabled>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <small class="text-danger" *ngIf="studentForm.get('gender')?.errors?.['required']">Please
                                select
                                your
                                gender!</small>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Country of Birth:</label>
                            <input type="text" class="form-control" formControlName="place_of_birth" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Nationality:</label>
                            <input type="text" class="form-control" formControlName="nationality" />
                        </div>
                    </div>
                </div>

                <!-- Row 3 -->
                <div class="row mt-3">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Passport Start Date:</label>
                            <input type="date" class="form-control" formControlName="passport_start_date" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Passport Expiry Date:</label>
                            <input type="date" class="form-control" formControlName="passport_expiry_date" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Passport Status:</label>
                            <select class="form-control" formControlName="passport_status">
                                <option value="current">Current passport</option>
                                <option value="none">No passport</option>
                                <option value="Valid">Valid</option>
                            </select>
                        </div>
                    </div>
                </div>


                <div class="row mt-3">

                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Email:<sup *ngIf="displayValidation">*</sup></label>
                            <input type="text" class="form-control" formControlName="email" />
                            <small class="text-danger" *ngIf="studentForm.get('email')?.errors?.['required']">Please
                                enter
                                your
                                email!</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Phone:<sup *ngIf="displayValidation">*</sup></label>
                            <input type="text" class="form-control" formControlName="phone_no" />
                            <small class="text-danger" *ngIf="studentForm.get('phone_no')?.errors?.['required']">Please
                                enter your
                                phone!</small>
                        </div>
                    </div>
                </div>


                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary" [disabled]="!studentForm.valid"
                        (click)="onSubmit()">Submit</button>
                </div>

            </div>
        </div>
    </form>
</div>
