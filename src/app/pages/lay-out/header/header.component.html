<header class="topbar">
  <div class="topbar-actions">
    <div class="search-container">
      <div class="search-box" (click)="open = true">
        <i class="bi bi-search search-icon"></i>
        <input
          type="text"
          placeholder="Search Patient/Case"
          readonly
          (focus)="open = true"
        />
        <i class="bi bi-chevron-down search-arrow" [class.search-arrow-open]="open"></i>
      </div>

      <div class="dropdown-form" *ngIf="open">
        <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
          <div class="form-group">
            <label>Patient Name</label>
            <input type="text" formControlName="patientName" />
          </div>

          <div class="form-group">
            <label>Case ID</label>
            <input type="text" formControlName="caseId" />
          </div>

          <button type="submit" class="search-submit">Search</button>
        </form>
      </div>
    </div>

    <button class="icon-button info-button" type="button" aria-label="Information">
      <i class="bi bi-info-circle-fill"></i>
    </button>

    <button class="icon-button" type="button" aria-label="Messages">
      <i class="bi bi-envelope-fill"></i>
    </button>

    <button class="icon-button" type="button" aria-label="Notifications">
      <i class="bi bi-bell-fill"></i>
    </button>

    <div class="dropdown">
      <button
        class="profile-trigger"
        type="button"
        id="userMenu"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <img src="assets/images/student.jpg" class="profile-img" alt="Profile Picture" />

        <span class="profile-copy">
          <small>Welcome</small>
          <span>{{ userName || 'Admin' }}</span>
        </span>

        <i class="bi bi-chevron-down"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item">Setting</a></li>
        <li><div class="custom-divider"></div></li>
        <li><a class="dropdown-item">Profile</a></li>
        <li><div class="custom-divider"></div></li>
        <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
      </ul>
    </div>

    <div class="dropdown">
      <button
        class="icon-button"
        type="button"
        id="quickMenu"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        aria-label="Quick menu"
      >
        <i class="bi bi-list"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" [routerLink]="['/dashboard']">Dashboard</a></li>
        <li><div class="custom-divider"></div></li>
        <li><a class="dropdown-item" [routerLink]="['/reports/student-report']">Reports</a></li>
      </ul>
    </div>
  </div>
</header>
