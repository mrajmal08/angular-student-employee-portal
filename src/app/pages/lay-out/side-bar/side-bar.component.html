<div class="sidebar-shell">
  <div class="brand-block">
    <div class="brand-mark">
      <img src="assets/images/logo/logo.svg" alt="Maven Mind" />
    </div>

    <div class="brand-copy">
      <span class="brand-title">Maven Mind</span>
      <small>Student Employee Portal</small>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      class="dashboard-link"
      [routerLink]="['/dashboard']"
      [class.active]="isRouteActive(['/dashboard'])"
    >
      <span class="dashboard-link-copy">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
      </span>
    </a>

    <div class="nav-caption">Modules</div>

    <div class="nav-section" *ngFor="let section of menuSections">
      <button
        type="button"
        class="section-toggle"
        [class.active]="isSectionActive(section)"
        (click)="toggleSection(section.id)"
      >
        <span class="section-toggle-copy">
          <i [class]="section.icon"></i>
          <span>{{ section.label }}</span>
        </span>

        <i
          class="bi section-arrow"
          [ngClass]="section.expanded ? 'bi-chevron-down' : 'bi-chevron-right'"
        ></i>
      </button>

      <div class="section-items" *ngIf="section.expanded">
        <a
          *ngFor="let item of section.items"
          class="nav-item-link"
          [routerLink]="[item.route]"
          [class.active]="isItemActive(item)"
        >
          <span class="item-indicator"></span>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </div>
  </nav>
</div>
