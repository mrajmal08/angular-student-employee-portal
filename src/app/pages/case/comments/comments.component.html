<div class="main">

  <div class="header">
    <div class="title">Comments</div>
    <i class="fa fa-times" (click)="close()"></i>
  </div>

  <div class="comment-box">
    <div class="filter-section">

      <div class="dropdown-container">
        <select class="form-select" [(ngModel)]="selectedCategoryId"
          (change)="onCategoryChange($any($event.target).value)">
          <option value="" disabled>Select Comment Type</option>
          <option *ngFor="let category of commentCategories" [value]="category.id">{{ category.name }}</option>
        </select>
      </div>
      <div class="filter-section">

        <button (click)="onReset()">Reset</button>
        <button (click)="onFilter()">Filter</button>
      </div>
    </div>

    <div class="messages-section">
      <div *ngFor="let comment of commentsData" class="message">
        <div class="meta">
          <span class="role">{{ comment.role_name }}</span>
          <span class="pipe">|</span>
          <span class="category">{{ comment.category_name }}</span>
          <span class="pipe blue">|</span>
          <span class="id">{{ caseId }}</span>
          <span class="pipe grey">|</span>
          <span class="me">{{ comment.created_by_user_name }}</span>
          <img class="icon" src="assets/doctor-icon.png" />
        </div>
        <div class="bubble">{{ comment.message }}</div>
        <div class="timestamp">{{ comment.created_at | date:'medium' }}</div>
      </div>
    </div>

    <form [formGroup]="commentForm" (ngSubmit)="sendMessage()">
      <div class="dropdown-container">
        <select class="form-select rounded-input" formControlName="comment_category_id">
          <option value="" disabled>Comment Type</option>
          <option *ngFor="let category of commentCategories" [value]="category.id">{{ category.name }}</option>
        </select>
      </div>
      <input type="text" class="rounded-input" formControlName="message" placeholder="Type a message*" />
      <button type="submit" [disabled]="!commentForm.get('message')?.value">Send</button>
    </form>
  </div>

</div>
