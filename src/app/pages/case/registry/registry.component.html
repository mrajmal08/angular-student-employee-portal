<div class="tab-content">
    <div class="row">
        <div class="col-sm-12">
            <form [formGroup]="registryForm">
                <div class="col-sm-12">
                    <div class="card mt-3">
                        <div class="card-header">
                            <span>Registery Details</span>
                        </div>
                        <div class="card-body">
                            <div>
                                <div class="row mt-3">
                                    <div class="col-md-4">
                                        <div class=" form-group">
                                            <label>
                                                Student current status:
                                            </label>
                                            <ng-select #courseSelect [items]="currentStatuses" bindLabel="name"
                                                bindValue="id" placeholder="Select an option"
                                                formControlName="student_status" [clearable]="false"
                                                (change)="onStudentStatusChange($event)">
                                            </ng-select>
                                        </div>
                                    </div>



                                    <div class="col-md-4" *ngIf="isBreakInStudyDropDownItems">
                                        <div class=" form-group">
                                            <label>
                                                Break in Study:
                                            </label>

                                            <ng-select #courseSelect [items]="breakInStudyDropDownItems"
                                                bindLabel="name" bindValue="id" placeholder="Select an option"
                                                formControlName="break_in_study" [clearable]="false"
                                                (change)="onBreakinStudyChange($event)">
                                            </ng-select>
                                        </div>
                                    </div>



                                    <div class="col-md-4" *ngIf="isStudentWithdrawnItems">
                                        <div class=" form-group">
                                            <label>
                                                Student withdrawn:
                                            </label>

                                            <ng-select #courseSelect [items]="studentWithdrawnItems" bindLabel="name"
                                                bindValue="id" placeholder="Select an option"
                                                formControlName="student_withdrawn" [clearable]="false"
                                                (change)="onStudentWithdrawChange($event)">
                                            </ng-select>
                                        </div>
                                    </div>


                                    <div class="col-md-4" *ngIf="isBreakReturnDate">
                                        <div class="form-group">
                                            <label>Break Return Date:</label>
                                            <input type="date" class="form-control"
                                                formControlName="break_return_date" />
                                        </div>
                                    </div>


                                    <div class="col-md-4" *ngIf="isWithdrawDate">
                                        <div class="form-group">
                                            <label>Withdraw Date:</label>
                                            <input type="date" class="form-control" formControlName="withdraw_date" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" *ngIf="isBreakSmsReporting">
                                        <label>SMS Reporting:</label>
                                        <div style="margin-left: 5px;">
                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="registryForm.get('break_sms_reporting')?.value === 'yes'"
                                                    (change)="onBreakInStudySmsReportingChange('yes')" id="Yes1" />
                                                <label class="form-check-label" for="Yes1">Yes</label>
                                            </div>

                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="registryForm.get('break_sms_reporting')?.value === 'no'"
                                                    (change)="onBreakInStudySmsReportingChange('no')" id="No1" />
                                                <label class="form-check-label" for="No1">No</label>
                                            </div>

                                        </div>
                                    </div>


                                    <div class="col-md-4" *ngIf="isWithdrawnSMSReporting">
                                        <label>SMS Reporting:</label>
                                        <div style="margin-left: 5px;">
                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="registryForm.get('withdraw_sms_reporting')?.value === 'yes'"
                                                    (change)="onStudentWithdrawSmsReportingChange('yes')" id="Yes2" />
                                                <label class="form-check-label" for="Yes2">Yes</label>
                                            </div>

                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input"
                                                    [checked]="registryForm.get('withdraw_sms_reporting')?.value === 'no'"
                                                    (change)="onStudentWithdrawSmsReportingChange('no')" id="No2" />
                                                <label class="form-check-label" for="No2">No</label>
                                            </div>

                                        </div>
                                    </div>


                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isWithdrawScreenShot">
                                        <div class="col-md-12">
                                            <label>Upload screenshot of sms:</label>
                                            <input type="file" formControlName="withdraw_screenshot"
                                                (change)="onWithdrawScreenshotUploadFile($event)" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isAttendanceMonitoringPlan">
                                        <div class="col-md-12">
                                            <label>Upload Attendance Monitoring Plan:</label>
                                            <input type="file" formControlName="attendance_monitoring_plan"
                                                (change)="onAttendanceMonitoringPlanUploadFile($event)" />
                                        </div>
                                    </div>


                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isFitnessToStudyPlan">
                                        <div class="col-md-12">
                                            <label>Upload Fitness To Study Plan:</label>
                                            <input type="file" formControlName="fitness_to_study_plan"
                                                (change)="onFitnessToStudyPlanUploadFile($event)" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isPregnancyEvidencePlan">
                                        <div class="col-md-12">
                                            <label>Upload Pregnancy Evidence:</label>
                                            <input type="file" formControlName="pregnancy_evidence"
                                                (change)="onPregnancyEvidenceUploadFile($event)" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isDisabilityPlan">
                                        <div class="col-md-12">
                                            <label>Upload Disability:</label>
                                            <input type="file" formControlName="disability"
                                                (change)="onDisabilityUploadFile($event)" />
                                        </div>
                                    </div>
                                    <div class="col-md-4" style="margin-top: 25px;" *ngIf="isRiskAssessmentPlan">
                                        <div class="col-md-12">
                                            <label>Upload Risk Assessment:</label>
                                            <input type="file" formControlName="risk_assessment"
                                                (change)="onRiskAssessmentUploadFile($event)" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" *ngIf="isBreakSmsDate">
                                        <div class="form-group">
                                            <label>Break SMS Date:</label>
                                            <input type="date" class="form-control" formControlName="break_sms_date" />
                                        </div>
                                    </div>

                                    <div class="col-md-4" style="margin-top: 25px;">
                                        <div class="form-group">
                                            <label>Transfer of course:</label>
                                            <input type="file" formControlName="transfer_of_course"
                                                (change)="onTransferOfCourseUploadFile($event)" />
                                        </div>
                                    </div>

                                </div>

                                <div class="text-center mt-3">
                                    <button type="submit" class="btn btn-primary" (click)="onSubmit()">Submit</button>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="card mt-3">
                        <div class="card-header">
                            <span>SMS Reporting</span>
                        </div>

                        <div class="card-body">
                            <div class="row mt-3">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>SMS reporting:</label>

                                        <ng-select [items]="smsReporting" bindLabel="name" [multiple]="true"
                                            formControlName="sms_reporting_reasons"
                                            (change)="onSMSReportingChange($event)">
                                        </ng-select>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Personal tutor:</label>
                                        <input type="text" class="form-control" formControlName="personal_tutor"
                                            placeholder="Personal tutor" />
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Notes:</label>
                                        <input type="text" class="form-control" formControlName="notes"
                                            placeholder="Notes" />
                                    </div>
                                </div>
                            </div>

                            <div class="row mt-3"
                                *ngIf="this.registryForm.get('sms_reporting_reasons')?.value?.length > 0">
                                <div class="col-md-12">
                                    <label>Upload Document:</label>
                                    <input type="file" formControlName="sms_reporting_attachments"
                                        (change)="onRiskAssessmentUploadFile($event)" multiple />
                                </div>
                            </div>

                            <div style="margin-top: 15px;"
                                *ngFor="let fileCtrl of smsReportingAttachmentsFiles.controls; let i = index">
                                {{ fileCtrl.value.name }}
                                <button (click)="removeFile(i)">Remove</button>
                            </div>

                            <div class="text-center mt-3">
                                <button type="submit" class="btn btn-primary"
                                    (click)="onSMSReportingSubmit()">Submit</button>
                            </div>

                        </div>
                    </div>

                    <div class="card mt-3">
                        <div class="card-header">
                            <span>Academic calendar dates</span>
                        </div>

                        <div class="card-body">
                            <div class="row mt-3">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Course submission date:</label>
                                        <input type="date" class="form-control"
                                            formControlName="course_submission_date" />
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Resubmission date:</label>
                                        <input type="date" class="form-control" formControlName="resubmission_date" />
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Chaser date:</label>
                                        <input type="date" class="form-control" formControlName="chaser_date" />
                                    </div>
                                </div>

                            </div>

                            <div class="row mt-3">

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Eligible for:</label>
                                        <input type="text" class="form-control" formControlName="eligible_for"
                                            placeholder="Eligible for" />
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Date of Award:</label>
                                        <input type="date" class="form-control" formControlName="date_of_award" />
                                    </div>
                                </div>

                                <div class="col-md-4">

                                    <label>New visa required:</label>
                                    <div class="row" style="margin-left: 5px;">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('new_visa_required')?.value === 'yes'"
                                                (change)="onNewViseRequiredChange('yes')" id="Yes3" />
                                            <label class="form-check-label" for="Yes3">Yes</label>
                                        </div>

                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('new_visa_required')?.value === 'no'"
                                                (change)="onNewViseRequiredChange('no')" id="No3" />
                                            <label class="form-check-label" for="No3">No</label>
                                        </div>

                                    </div>

                                    <!-- // Checkboxes in row... -->

                                    <!-- <div class="row" style="margin-left: 5px;">
                                        <div class="col-auto">
                                          <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('new_visa_required')?.value === 'yes'"
                                                (change)="onNewViseRequiredChange('yes')" id="smsYes" />
                                            <label class="form-check-label" for="smsYes">Yes</label>
                                          </div>
                                        </div>
                                      
                                        <div class="col-auto">
                                          <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('new_visa_required')?.value === 'no'"
                                                (change)="onNewViseRequiredChange('no')" id="smsNo" />
                                            <label class="form-check-label" for="smsNo">No</label>
                                          </div>
                                        </div>
                                      </div> -->


                                </div>
                            </div>

                            <div class="row mt-3">

                                <div class="col-md-4">
                                    <label>SMS Reporting:</label>
                                    <div class="row" style="margin-left: 5px;">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('sms_reporting')?.value === 'yes'"
                                                (change)="onsmsReportingChange('yes')" id="Yes4" />
                                            <label class="form-check-label" for="Yes4">Yes</label>
                                        </div>

                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('sms_reporting')?.value === 'no'"
                                                (change)="onsmsReportingChange('no')" id="No4" />
                                            <label class="form-check-label" for="No4">No</label>
                                        </div>

                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label>Student notified :</label>
                                    <div class="row" style="margin-left: 5px;">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('student_notified')?.value === 'yes'"
                                                (change)="onStudentNotifiedChange('yes')" id="Yes5" />
                                            <label class="form-check-label" for="Yes5">Yes</label>
                                        </div>

                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                [checked]="registryForm.get('student_notified')?.value === 'no'"
                                                (change)="onStudentNotifiedChange('no')" id="No5" />
                                            <label class="form-check-label" for="No5">No</label>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            <div class="text-center mt-3">
                                <button type="submit" class="btn btn-primary"
                                    (click)="onAcademicCalendarDatesSubmit()">Submit</button>
                            </div>

                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="text-end mt-3">
            <button type="submit" class="btn btn-view me-2">Previous</button>
            <button type="submit" class="btn btn-save">Next</button>
        </div>
    </div>

</div>
