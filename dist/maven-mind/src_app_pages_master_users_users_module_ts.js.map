<div class="d-flex mt-3 mb-3 justify-content-end">
  <button type="button" class="btn btn-secondary add-button" (click)="addNewAgent()">+ Add New User</button>
</div>

<form class="form w-100" style="margin: 20px 0px;" [formGroup]="filterForm" (ngSubmit)="onSelectFilters()"
  autocomplete="off" novalidate>

  <!-- Search User Title -->
  <div class="form-content search-filter-block position-relative ">
    <strong class="sub-title search-user-title">Search Users</strong>

    <!-- Toggle Button (Top Right) -->
    <button class="btn plus-btn position-absolute custom-btn"
      style="max-width: 42px; top: 42px; right: 20px; min-width: unset; " (click)="isCollapsed = !isCollapsed"
      [attr.aria-expanded]="!isCollapsed" aria-controls="collapseBasic" [class.btn-dark]="!isCollapsed"
      [class.btn-primary]="isCollapsed" type="button">
      <i class="bi bi-plus" *ngIf="isCollapsed"></i>
      <i class="bi bi-dash" *ngIf="!isCollapsed"></i>
    </button>

    <!-- <div class="position-absolute d-flex" style="top: 42px; right: 20px;">
      <button type="submit" class="btn btn-primary mx-1 filter-button" (click)="onApplyFilters()"
        [disabled]="isDisabled()">
        Filter
      </button>

      <button type="button" class="btn btn-outline-secondary mx-1 reset-button" (click)="onResetFilters()"
        [disabled]="isDisabled()">
        Reset
      </button>
    </div> -->

    <div class="row">
      <div class="field-block w-100">
        <div class="col-12" style="color: #808382;">
          <div class="row" style="padding-right: 100px;">

            <div class="col-12 col-sm-6 col-md-3">
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" formControlName="name" />
              </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="text" class="form-control" id="email" formControlName="email" />
              </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
              <div class="form-group">
                <label for="phone_no">Contact</label>
                <input type="text" class="form-control" id="phone_no" formControlName="phone_no" />
              </div>
            </div>


            <div class="col-md-3">
              <div class=" form-group">
                <label>Roles:</label>

                <ng-select #roleSelect [items]="roles" bindLabel="name" bindValue="id" formControlName="roles"
                  placeholder="Select a role" [clearable]="false" (change)="onRoleChange($event)">
                </ng-select>
              </div>

            </div>



          </div>

          <div id="collapseBasic" [@collapseAnimation]="isCollapsed ? 'collapsed' : 'expanded'">
            <div class="row" style="padding-right: 100px; margin-top: 12px;">
              <!-- <div class="col-md-3">
                <div class=" form-group">
                  <label>Roles:</label>

                  <ng-select [items]="roles" bindLabel="name" bindValue="id" formControlName="roles"
                    placeholder="Select a role" (change)="onRoleChange($event)">
                  </ng-select>
                </div>

              </div> -->

              <div class="col-md-3">
                <div class="form-group">
                  <label>Departments:</label>
                  <ng-select #departmentSelect [items]="departments" bindLabel="name" bindValue="id"
                    formControlName="departments" placeholder="Select a department" [clearable]="false"
                    (change)="onDepartmentChange($event)">
                  </ng-select>
                </div>
              </div>

              <div class="col-md-3">
                <div class=" form-group">
                  <label>Designations:</label>
                  <ng-select #designationSelect [items]="designations" bindLabel="name" bindValue="id"
                    formControlName="designations" placeholder="Select a designation" [clearable]="false"
                    (change)="onDesignationChange($event)">
                  </ng-select>
                </div>

              </div>
            </div>
          </div>

          <!-- Filter & Reset Buttons (Centered) -->
          <div class="d-flex justify-content-center mt-3" style="margin-right: 100px;">
            <!-- <button type="submit" class="btn btn-primary mx-2"
              style="background-color: #05a853; border: #05a853;">Filter</button>
            <button type="button" class="btn btn-default mx-2" (click)="onResetFilters()"
              [disabled]="true">Reset</button> -->
            <button type="submit" class="btn btn-primary mx-1 filter-button" (click)="onApplyFilters()"
              [disabled]="isDisabled()">
              Filter
            </button>

            <button type="button" class="btn btn-outline-secondary mx-1 reset-button" (click)="onResetFilters()"
              [disabled]="isDisabled()">
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>


<div class="d-flex justify-content-between align-items-center mb-2">
  <div>
    <label for="perPageSelect" class="me-2" style="padding-bottom: 10px; color: #000000;">Show</label>
    <select id="perPageSelect" class="form-select me-2" style="width: auto; display: inline-block;"
      (change)="updatePerPage($event)">
      <option *ngFor="let option of perPageOptions" [value]="option" [selected]="option === page.perPage">{{ option }}
      </option>
    </select>
    <label for="perPageSelect" class="me-2" style="padding-bottom: 10px; color: #000000;">entries</label>
  </div>
  <!-- <div>
    <span>Page {{ page.page }} of {{ getTotalPages() }}</span>
  </div> -->
</div>
<ngx-datatable class="bootstrap custom-table" [rows]="rows" [columns]="columns" [columnMode]="'force'"
  [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [scrollbarH]="true" [limit]="page.perPage"
  [count]="page.total" [offset]="page.page - 1" [externalPaging]="true" (page)="setPage($event)">

  <ngx-datatable-column *ngFor="let col of columns" [name]="col.name" [prop]="col.prop" [sortable]="false">

    <ng-template ngx-datatable-header-template let-column="column">
      <div class="mgx-header">{{ column.name }}</div>
    </ng-template>

    <ng-template ngx-datatable-cell-template let-value="value" let-row="row" let-column="column">

      <!-- Custom blue switch for 'status' column -->
      <div class="text-center" *ngIf="column.prop === 'status'; else defaultCell">
        <label class="switch">
          <input type="checkbox" [checked]="row.status === 1" (change)="onStatusToggle(row)" />
          <span class="slider blue"></span>
        </label>
      </div>

      <!-- Default text value for other columns -->
      <ng-template #defaultCell>
        <div class="text-center">{{ value }}</div>
        <div *ngIf="column.name === 'Created By'">
          <small>{{ row.created_at | date: 'short' }}</small>
        </div>
        <div *ngIf="column.name === 'Updated By'">
          <small>{{ row.updated_at | date: 'short' }}</small>
        </div>
      </ng-template>

    </ng-template>
  </ngx-datatable-column>




  <ngx-datatable-column name="Action" [width]="150">
    <ng-template ngx-datatable-header-template>
      <div class="mgx-header text-center">Action</div>
    </ng-template>

    <ng-template ngx-datatable-cell-template let-row="row">
      <div class="d-flex justify-content-center gap-2">
        <!-- <button class="btn btn-sm btn-primary" style="min-width: 60px; padding: 5px 10px;" (click)="editStatus(row)"> -->
        <input type="checkbox" style="cursor: pointer;" (change)="onCheckboxChange($event, row)"
          (click)="$event.stopPropagation()" />


        <!-- <mat-icon>person_outline</mat-icon> -->
        <!-- <span _ngcontent-lce-c497="" class="fake-input"></span> -->
        <i class="bi bi-person-fill fs-6 " style="color: #58aff7; margin-bottom: 2px; cursor: pointer;"></i>


        <!-- <i class="bi bi-pencil fs-8 pt-1" style="color: green; cursor: pointer;" (click)="editCourse(row)">
        </i> -->
        <i class="bi bi-pen" style="margin-left: 0; cursor: pointer;" (click)="editUser(row)"></i>


        <!-- </button> -->
        <!-- <button class="btn btn-sm btn-danger" style="min-width: 60px; padding: 5px 10px;" (click)="onDeleteCourse(row)"> -->


        <!-- <i class="bi bi-x fs-4" style="color: red; cursor: pointer;" title="Remove" (click)="onDeleteCourse(row)">
        </i> -->

        <i class="bi bi-x-lg text-danger" style="font-weight: bold; cursor: pointer;" (click)="onDeleteUser(row)"></i>
        <!-- </button> -->
      </div>
    </ng-template>
  </ngx-datatable-column>

</ngx-datatable>
